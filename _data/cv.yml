      - name: Hardware
        keywords: [Inter-process communication (IPC), multi-core SoC, TI TDA4, ESP32, STM32, Raspberry Pi]
      - name: Tools and testing
        keywords: [Lauterbach Trace32, GDB, Jenkins, Bazel, Git, unit testing, HIL testing]

    Awards:
