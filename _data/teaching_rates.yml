# Rates and discounts driving the teaching-page estimator widget.
# Edit values here; templates and JS read them automatically.
#
# unit_label  — what "quantity" represents for that service (shown next to the input)
# rate        — price per unit in `currency`. Use `null` for TBA / by-quote services.
# group_discount.multiplier — applied when quantity-units do not represent group size;
#                             the estimator only applies it if the service has `group_pricing: true`.

currency: USD

services:
  - id: mentoring-1on1
    label: "1:1 Mentoring"
    unit_label: "hours"
    rate: 100
    group_pricing: false

  - id: code-review
    label: "Async code / project review"
    unit_label: "hours of review"
    rate: 120
    group_pricing: false

  - id: python-devops-seat
    label: "Python for DevOps — single seat (12 weeks)"
    unit_label: "seats"
    rate: 500
    group_pricing: true

  - id: weekly-live-july-2026
    label: "Live 2-month python dev course (July 2026 cohort)"
    unit_label: "seats"
    rate: 500
    group_pricing: true

group_discount:
  threshold: 3 # 3+ seats
  multiplier: 0.85 # 15% off
